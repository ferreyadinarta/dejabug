name: dejabug
description: Comment steps to reproduce on issues that include a bug video
author: Ferrey Adinarta
branding:
  icon: film
  color: purple

inputs:
  anthropic-api-key:
    description: Anthropic API key (or use claude-code-oauth-token)
    required: false
  claude-code-oauth-token:
    description: Claude Code OAuth token from `claude setup-token` (uses your Claude subscription)
    required: false
  github-token:
    description: Token used to read the issue and post the comment
    default: ${{ github.token }}
  issue-number:
    description: Issue to read (defaults to the issue that triggered the run)
    default: ${{ github.event.issue.number }}
  model:
    description: Model that writes the steps
    default: opus
  version:
    description: dejabug version to install from PyPI
    default: ""
  dry-run:
    description: Print the comment instead of posting it
    default: ""

runs:
  using: composite
  steps:
    - uses: actions/setup-python@v5
      with:
        python-version: "3.12"
    - name: Install
      shell: bash
      env:
        VERSION: ${{ inputs.version }}
      run: |
        python -m pip install --quiet "dejabug${VERSION:+==$VERSION}"
        npm install --silent -g @anthropic-ai/claude-code
    - name: Write steps and comment
      shell: bash
      env:
        ANTHROPIC_API_KEY: ${{ inputs.anthropic-api-key }}
        CLAUDE_CODE_OAUTH_TOKEN: ${{ inputs.claude-code-oauth-token }}
        GITHUB_TOKEN: ${{ inputs.github-token }}
        GH_TOKEN: ${{ inputs.github-token }}
        ISSUE: ${{ inputs.issue-number }}
        MODEL: ${{ inputs.model }}
        DRY_RUN: ${{ inputs.dry-run }}
        REPO: ${{ github.repository }}
        RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      run: |
        [ -n "$ANTHROPIC_API_KEY" ] || unset ANTHROPIC_API_KEY
        [ -n "$CLAUDE_CODE_OAUTH_TOKEN" ] || unset CLAUDE_CODE_OAUTH_TOKEN
        python "${{ github.action_path }}/dejabug/action.py"
