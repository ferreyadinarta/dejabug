[project]
name = "dejabug"
version = "0.1.0"
description = "Turn a screen recording of a bug into a test that fails the same way."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "imageio-ffmpeg>=0.6.0",
    "numpy>=2.5.4",
    "ocrmac>=1.0.1",
    "opencv-python-headless>=5.0.0.93",
    "playwright>=1.63.0",
]

[project.scripts]
dejabug = "dejabug.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["dejabug"]
