[project]
name = "dejabug"
version = "0.1.1"
description = "Turn a screen recording of a web-app bug into steps to reproduce, and into a test that fails the same way."
readme = "README.md"
license = "MIT"
authors = [{ name = "Ferrey Adinarta" }]
keywords = ["bug-reproduction", "playwright", "screen-recording", "testing", "qa", "ai-agents", "claude-code"]
requires-python = ">=3.12"
dependencies = [
    "imageio-ffmpeg>=0.6.0",
    "numpy>=2.5.4",
    "ocrmac>=1.0.1; sys_platform == 'darwin'",
    "rapidocr>=3.0; sys_platform != 'darwin'",
    "onnxruntime>=1.20; sys_platform != 'darwin'",
    "opencv-python-headless>=5.0.0.93",
]

[project.optional-dependencies]
run = ["playwright>=1.63.0"]

[project.urls]
Homepage = "https://github.com/ferreyadinarta/dejabug"
Repository = "https://github.com/ferreyadinarta/dejabug"
Issues = "https://github.com/ferreyadinarta/dejabug/issues"

[project.scripts]
dejabug = "dejabug.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["dejabug"]

[dependency-groups]
dev = ["pytest>=8", "playwright>=1.63.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.hatch.build.targets.sdist]
include = ["dejabug", "tests", "README.md", "LICENSE", "pyproject.toml"]
